<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>BunBunGram</title>
  <meta name="description" content="Our little reel corner — BunBunGram">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand">
      <span class="brand-mark">♡</span>
      <span class="wordmark">BunBunGram</span>
    </a>
    <div class="top-actions">
      <button id="globalSound" class="glass-btn" title="Sound">🔊</button>
      <button id="infoBtn" class="glass-btn" title="About">🐰</button>
    </div>
  </header>

  <main id="feed" class="feed"></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-mode="home"><b>⌂</b><span>Home</span></button>
    <button class="nav-btn" data-mode="random"><b>✦</b><span>Random</span></button>
    <button class="nav-btn" data-mode="liked"><b>♡</b><span>Liked</span></button>
  </nav>

  <template id="reelTpl">
    <article class="reel">
      <video class="reel-video" playsinline loop preload="metadata"></video>
      <div class="shade"></div>
      <button class="big-play" aria-label="Play or pause">▶</button>
      <div class="heart-pop">♥</div>

      <section class="meta">
        <div class="profile">
          <span class="avatar">🐰</span>
          <strong>@bunbungram</strong>
          <span class="soft">• just us</span>
        </div>
        <p class="caption"></p>
        <div class="audio">♫ <span>our memories</span></div>
      </section>

      <aside class="side-actions">
        <button class="action like">
          <span class="circle">♡</span><small>Like</small>
        </button>
        <button class="action sound">
          <span class="circle">🔊</span><small>Sound</small>
        </button>
        <button class="action fullscreen">
          <span class="circle">⛶</span><small>Full</small>
        </button>
        <button class="action share">
          <span class="circle">➤</span><small>Share</small>
        </button>
      </aside>

      <div class="timeline"><div></div></div>
    </article>
  </template>

  <dialog id="about">
    <button class="close">×</button>
    <div class="dialog-bunny">🐰</div>
    <h2>BunBunGram</h2>
    <p>Our tiny corner for reels, smiles and memories. No accounts. No noise. Just us. ♡</p>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
